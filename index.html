<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<title>わたしのレシピ帳</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans JP",sans-serif;background:#f7f3ec;color:#302c28}button,input,textarea,select{font:inherit}.app{min-height:100vh}.hero{background:#fffaf2;border-bottom:1px solid #e5ddd1;padding:32px 20px}.hero-inner{max-width:1000px;margin:auto}.small{color:#9a633e;font-size:12px;font-weight:bold;letter-spacing:2px}.hero h1{margin:8px 0;font-size:32px}.hero p{margin:0;color:#766e65}.main{max-width:1000px;margin:auto;padding:24px 20px}.search{width:100%;padding:14px 16px;border:1px solid #ddd3c6;border-radius:12px;background:white}.categories{display:flex;gap:8px;overflow:auto;padding:16px 0}.category{white-space:nowrap;border:1px solid #ddd3c6;background:white;border-radius:20px;padding:9px 14px;cursor:pointer}.category.active{background:#9a633e;color:white;border-color:#9a633e}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.recipe{background:white;border:1px solid #e5ddd1;border-radius:16px;padding:0 0 18px;cursor:pointer;overflow:hidden}.recipe:hover{box-shadow:0 8px 20px #0001}.recipe-image{width:100%;height:170px;object-fit:cover;background:#eee5d8;display:block}.recipe-content{padding:0 18px}.type{font-size:12px;color:#9a633e;font-weight:bold}.recipe-content .type{margin-top:16px}.recipe h2{font-size:18px;margin:7px 0}.time{color:#766e65;font-size:13px}.tags{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}.tag{background:#f0e8dc;border-radius:6px;padding:5px 8px;font-size:11px}.empty{text-align:center;padding:50px;color:#766e65}.add{position:fixed;right:24px;bottom:24px;border:0;border-radius:50px;background:#9a633e;color:white;padding:14px 20px;box-shadow:0 8px 20px #0003;cursor:pointer}.panel{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:18px}.panel.open{display:flex}.box{background:#fffaf2;width:min(620px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:24px}.close{float:right;border:0;background:none;font-size:25px;cursor:pointer}.box h2{margin-top:0}.detail-image{width:100%;max-height:320px;object-fit:cover;border-radius:12px;margin:8px 0 18px}.box h3{margin:22px 0 8px}.box li{margin:8px 0}.field{margin:12px 0}.field label{display:block;font-weight:bold;font-size:13px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #ddd3c6;border-radius:9px;background:white}.field textarea{min-height:90px}.save{width:100%;border:0;border-radius:10px;background:#9a633e;color:white;padding:12px;margin-top:10px;cursor:pointer}@media(max-width:600px){.hero h1{font-size:27px}.main{padding:18px 14px}.grid{grid-template-columns:1fr}.add{right:16px;bottom:16px}}
</style>
</head>
<body>
<div class="app">
<header class="hero"><div class="hero-inner"><div class="small">MY RECIPE BOOK</div><h1>今日、なに作る？</h1><p>自分だけの料理を、食材やカテゴリからすぐ探せるレシピ帳。</p><div id="authArea" style="margin-top:16px"></div></div></header>
<main class="main"><input class="search" id="search" placeholder="料理名・食材・タグで検索"><div class="categories" id="categories"></div><div class="grid" id="recipes"></div></main>
<button class="add" id="addButton">＋ レシピ追加</button>
</div>
<div class="panel" id="panel"><div class="box" id="box"></div></div>
<script>
const categories=['すべて','汁物','おつまみ','お菓子・デザート','肉','魚介','野菜','卵','豆・大豆製品','ご飯・穀物','麺・パスタ','パン・粉もの','その他'];
const SUPABASE_URL='https://bysswjjserhznmrbevph.supabase.co';
const SUPABASE_KEY='sb_publishable_hCS3EhGtIDKeBTYdcoYDzQ_mMZBFjJH';
const SUPABASE_TABLE='recipes';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null;
let selected='すべて';
let recipes=JSON.parse(localStorage.getItem('myRecipeBook')||'null')||[];
function render(){const q=document.getElementById('search').value.trim().toLowerCase();document.getElementById('categories').innerHTML=categories.map(c=>'<button class="category '+(c===selected?'active':'')+'" data-cat="'+c+'">'+c+'</button>').join('');document.querySelectorAll('.category').forEach(b=>b.onclick=()=>{selected=b.dataset.cat;render()});const list=currentUser?recipes.filter(r=>(selected==='すべて'||r.cat===selected)&&JSON.stringify(r).toLowerCase().includes(q)):[];document.getElementById('recipes').innerHTML=list.length?list.map((r,i)=>'<article class="recipe" data-index="'+recipes.indexOf(r)+'"><div class="recipe-content"><div class="type">'+r.cat+'</div><h2>'+r.name+'</h2><div class="time">⏱ '+r.time+'</div><div class="tags">'+r.tags.map(t=>'<span class="tag">'+t+'</span>').join('')+'</div></div></article>').join(''):'<div class="empty">'+(currentUser?'該当するレシピがありません。':'ログインすると、あなたのレシピが表示されます。')+'</div>';document.querySelectorAll('.recipe').forEach(card=>card.onclick=()=>showRecipe(Number(card.dataset.index)))}
function renderAuth(){const a=document.getElementById('authArea');if(currentUser){a.innerHTML='<div style="font-size:13px;color:#766e65">ログイン中：'+currentUser.email+' <button id="logout" style="margin-left:8px;border:1px solid #ddd3c6;border-radius:8px;background:white;padding:6px 10px;cursor:pointer">ログアウト</button></div>';document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};return}a.innerHTML='<div style="display:flex;gap:8px;max-width:520px"><input id="loginEmail" type="email" placeholder="メールアドレス" style="flex:1;padding:10px;border:1px solid #ddd3c6;border-radius:9px;background:white"><input id="loginPassword" type="password" placeholder="パスワード" style="flex:1;padding:10px;border:1px solid #ddd3c6;border-radius:9px;background:white"><button id="login" style="border:0;border-radius:9px;background:#9a633e;color:white;padding:10px 14px;cursor:pointer;white-space:nowrap">ログイン</button></div><div id="loginMessage" style="font-size:12px;color:#9a633e;margin-top:7px"></div>';document.getElementById('login').onclick=login}
async function login(){const email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value;const m=document.getElementById('loginMessage');if(!email||!password){m.textContent='メールアドレスとパスワードを入力してください。';return}m.textContent='ログインしています…';const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){m.textContent='ログインできませんでした。メールアドレスまたはパスワードを確認してください。';return}currentUser=data.user;renderAuth();await loadRecipes()}
async function initAuth(){const {data}=await sb.auth.getSession();currentUser=data.session?.user||null;renderAuth();if(currentUser)await loadRecipes()}
function showRecipe(i){const r=recipes[i];document.getElementById('box').innerHTML='<button class="close" id="close">×</button>'+(r.image?'<img class="detail-image" src="'+r.image+'" alt="'+r.name+'">':'')+'<div class="type">'+r.cat+'</div><h2>'+r.name+'</h2><div class="time">⏱ '+r.time+'</div><h3>材料</h3><ul>'+r.ingredients.map(x=>'<li>'+x+'</li>').join('')+'</ul><h3>作り方</h3><ol>'+r.steps.map(x=>'<li>'+x+'</li>').join('')+'</ol><button class="save" id="edit">レシピを編集</button><button id="deleteRecipe" style="width:100%;border:1px solid #c88;border-radius:10px;background:white;color:#a44;padding:12px;margin-top:10px;cursor:pointer">レシピを削除</button>';openPanel();document.getElementById('edit').onclick=()=>openEdit(i);document.getElementById('deleteRecipe').onclick=()=>deleteRecipe(i)}
function openAdd(){document.getElementById('box').innerHTML='<button class="close" id="close">×</button><h2>レシピを追加</h2><div class="field"><label>料理名</label><input id="name"></div><div class="field"><label>区分</label><select id="cat">'+categories.slice(1).map(c=>'<option>'+c+'</option>').join('')+'</select></div><div class="field"><label>所要時間</label><input id="time" placeholder="20分"></div><div class="field"><label>料理写真（iPhoneの写真から選択）</label><input id="imageFile" type="file" accept="image/*"><img id="photoPreview" class="detail-image" style="display:none" alt="選択した料理写真"><input id="image" type="hidden"></div><div class="field"><label>画像URL（任意）</label><input id="imageUrl" placeholder="https://..."></div><div class="field"><label>タグ</label><input id="tags" placeholder="肉,和食,簡単,作り置き"></div><div class="field"><label>材料（1行1項目）</label><textarea id="ingredients"></textarea></div><div class="field"><label>作り方（1行1工程）</label><textarea id="steps"></textarea></div><button class="save" id="save">保存する</button>';openPanel();document.getElementById('imageFile').onchange=handlePhoto;document.getElementById('save').onclick=saveRecipe}
function handlePhoto(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{document.getElementById('image').value=reader.result;const preview=document.getElementById('photoPreview');preview.src=reader.result;preview.style.display='block'};reader.readAsDataURL(file)}
async function loadRecipes(){if(!currentUser)return;try{const {data,error}=await sb.from(SUPABASE_TABLE).select('*').eq('user_id',currentUser.id);if(error)throw error;if(Array.isArray(data)){recipes=data.map(r=>({id:r.id,name:r.name,cat:r.category,time:r.time||'—',image:r.image||'',tags:Array.isArray(r.tags)?r.tags:[],ingredients:Array.isArray(r.ingredients)?r.ingredients:[],steps:Array.isArray(r.steps)?r.steps:[]}));localStorage.setItem('myRecipeBook',JSON.stringify(recipes));render()}}catch(e){console.warn('Supabaseから読み込めませんでした。ローカルデータを使用します。',e)}}
async function saveRecipe(){if(!currentUser){alert('先にログインしてください。');return}const recipe={name:document.getElementById('name').value.trim()||'無題のレシピ',cat:document.getElementById('cat').value,time:document.getElementById('time').value||'—',image:document.getElementById('image').value||document.getElementById('imageUrl').value.trim(),tags:document.getElementById('tags').value.split(',').map(x=>x.trim()).filter(Boolean),ingredients:document.getElementById('ingredients').value.split('\n').filter(Boolean),steps:document.getElementById('steps').value.split('\n').filter(Boolean)};const {data,error}=await sb.from(SUPABASE_TABLE).insert({user_id:currentUser.id,name:recipe.name,category:recipe.cat,time:recipe.time,image:recipe.image,tags:recipe.tags,ingredients:recipe.ingredients,steps:recipe.steps}).select().single();if(error){alert('保存できませんでした。Supabaseの設定を確認してください。');console.warn(error);return}recipe.id=data.id;recipes.unshift(recipe);localStorage.setItem('myRecipeBook',JSON.stringify(recipes));closePanel();render()}
function openEdit(i){const r=recipes[i];document.getElementById('box').innerHTML='<button class="close" id="close">×</button><h2>レシピを編集</h2><div class="field"><label>料理名</label><input id="name" value="'+r.name.replace(/"/g,'&quot;')+'"></div><div class="field"><label>区分</label><select id="cat">'+categories.slice(1).map(c=>'<option '+(c===r.cat?'selected':'')+'>'+c+'</option>').join('')+'</select></div><div class="field"><label>所要時間</label><input id="time" value="'+(r.time||'')+'" placeholder="20分"></div><div class="field"><label>料理写真（iPhoneの写真から選択）</label><input id="imageFile" type="file" accept="image/*"><img id="photoPreview" class="detail-image" style="'+(r.image?'display:block':'display:none')+'" src="'+(r.image||'')+'" alt="選択した料理写真"><input id="image" type="hidden" value="'+(r.image||'')+'"></div><div class="field"><label>画像URL（任意）</label><input id="imageUrl" value=""></div><div class="field"><label>タグ</label><input id="tags" value="'+r.tags.join(',')+'"></div><div class="field"><label>材料（1行1項目）</label><textarea id="ingredients">'+r.ingredients.join('\n')+'</textarea></div><div class="field"><label>作り方（1行1工程）</label><textarea id="steps">'+r.steps.join('\n')+'</textarea></div><button class="save" id="update">変更を保存</button>';openPanel();document.getElementById('imageFile').onchange=handlePhoto;document.getElementById('update').onclick=()=>updateRecipe(i)}
async function updateRecipe(i){if(!currentUser)return;const recipe={name:document.getElementById('name').value.trim()||'無題のレシピ',cat:document.getElementById('cat').value,time:document.getElementById('time').value||'—',image:document.getElementById('image').value||document.getElementById('imageUrl').value.trim(),tags:document.getElementById('tags').value.split(',').map(x=>x.trim()).filter(Boolean),ingredients:document.getElementById('ingredients').value.split('\n').filter(Boolean),steps:document.getElementById('steps').value.split('\n').filter(Boolean)};const {data,error}=await sb.from(SUPABASE_TABLE).update({name:recipe.name,category:recipe.cat,time:recipe.time,image:recipe.image,tags:recipe.tags,ingredients:recipe.ingredients,steps:recipe.steps}).eq('id',recipes[i].id).eq('user_id',currentUser.id).select().single();if(error){alert('変更を保存できませんでした。');console.warn(error);return}recipe.id=data.id;recipes[i]=recipe;localStorage.setItem('myRecipeBook',JSON.stringify(recipes));closePanel();render()}
async function deleteRecipe(i){if(!currentUser)return;if(!confirm('「'+recipes[i].name+'」を削除しますか？\nこの操作は元に戻せません。'))return;const {error}=await sb.from(SUPABASE_TABLE).delete().eq('id',recipes[i].id).eq('user_id',currentUser.id);if(error){alert('レシピを削除できませんでした。');console.warn(error);return}recipes.splice(i,1);localStorage.setItem('myRecipeBook',JSON.stringify(recipes));closePanel();render()}
function openPanel(){document.getElementById('panel').classList.add('open');document.getElementById('close').onclick=closePanel}function closePanel(){document.getElementById('panel').classList.remove('open')}
document.getElementById('search').addEventListener('input',render);document.getElementById('addButton').onclick=openAdd;document.getElementById('panel').onclick=e=>{if(e.target.id==='panel')closePanel()};render();initAuth();
</script>
</body>
</html>
