<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<title>わたしのレシピ帳</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans JP",sans-serif;background:#f7f3ec;color:#302c28}button,input,textarea,select{font:inherit}.app{min-height:100vh}.hero{background:#fffaf2;border-bottom:1px solid #e5ddd1;padding:32px 20px}.hero-inner{max-width:1000px;margin:auto}.small{color:#9a633e;font-size:12px;font-weight:bold;letter-spacing:2px}.hero h1{margin:8px 0;font-size:32px}.hero p{margin:0;color:#766e65}.main{max-width:1000px;margin:auto;padding:24px 20px}.search{width:100%;padding:14px 16px;border:1px solid #ddd3c6;border-radius:12px;background:white}.categories{display:flex;gap:8px;overflow:auto;padding:16px 0}.category{white-space:nowrap;border:1px solid #ddd3c6;background:white;border-radius:20px;padding:9px 14px;cursor:pointer}.category.active{background:#9a633e;color:white;border-color:#9a633e}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.recipe{background:white;border:1px solid #e5ddd1;border-radius:16px;padding:0 0 18px;cursor:pointer;overflow:hidden}.recipe:hover{box-shadow:0 8px 20px #0001}.recipe-image{width:100%;height:170px;object-fit:cover;background:#eee5d8;display:block}.recipe-content{padding:0 18px}.type{font-size:12px;color:#9a633e;font-weight:bold}.recipe-content .type{margin-top:16px}.recipe h2{font-size:18px;margin:7px 0}.time{color:#766e65;font-size:13px}.tags{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}.tag{background:#f0e8dc;border-radius:6px;padding:5px 8px;font-size:11px}.empty{text-align:center;padding:50px;color:#766e65}.add{position:fixed;right:24px;bottom:24px;border:0;border-radius:50px;background:#9a633e;color:white;padding:14px 20px;box-shadow:0 8px 20px #0003;cursor:pointer}.panel{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:18px}.panel.open{display:flex}.box{background:#fffaf2;width:min(620px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:24px}.close{float:right;border:0;background:none;font-size:25px;cursor:pointer}.box h2{margin-top:0}.detail-image{width:100%;max-height:320px;object-fit:cover;border-radius:12px;margin:8px 0 18px}.box h3{margin:22px 0 8px}.box li{margin:8px 0}.field{margin:12px 0}.field label{display:block;font-weight:bold;font-size:13px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #ddd3c6;border-radius:9px;background:white}.field textarea{min-height:90px}.save{width:100%;border:0;border-radius:10px;background:#9a633e;color:white;padding:12px;margin-top:10px;cursor:pointer}@media(max-width:600px){.hero h1{font-size:27px}.main{padding:18px 14px}.grid{grid-template-columns:1fr}.add{right:16px;bottom:16px}}
</style>
</head>
<body>
<div class="app">
<header class="hero"><div class="hero-inner"><div class="small">MY RECIPE BOOK</div><h1>今日、なに作る？</h1><p>自分だけの料理を、食材やカテゴリからすぐ探せるレシピ帳。</p></div></header>
<main class="main"><input class="search" id="search" placeholder="料理名・食材・タグで検索"><div class="categories" id="categories"></div><div class="grid" id="recipes"></div></main>
<button class="add" id="addButton">＋ レシピ追加</button>
</div>
<div class="panel" id="panel"><div class="box" id="box"></div></div>
<script>
const categories=['すべて','汁物','おつまみ','お菓子・デザート','肉','魚介','野菜','卵','豆・大豆製品','ご飯・穀物','麺・パスタ','パン・粉もの','その他'];
let selected='すべて';
let recipes=JSON.parse(localStorage.getItem('myRecipeBook')||'null')||[
{name:'鶏むね肉の照り焼き',cat:'肉',time:'20分',image:'https://images.unsplash.com/photo-1604503468506-a8da13d82791?auto=format&fit=crop&w=800&q=80',tags:['肉','和食','高タンパク','簡単'],ingredients:['鶏むね肉 1枚','醤油 大さじ1','みりん 大さじ1','砂糖 小さじ1'],steps:['鶏肉を食べやすく切る','フライパンで両面を焼く','調味料を加えて照りが出るまで煮絡める']},
{name:'鮭とアボカドの冷製パスタ',cat:'麺・パスタ',time:'20分',image:'https://images.unsplash.com/photo-1473093295043-cdd812d0e601?auto=format&fit=crop&w=800&q=80',tags:['魚介','麺・パスタ','洋食','冷製','さっぱり'],ingredients:['鮭 1切れ','アボカド 1/2個','カッペリーニ 80g','オリーブオイル・塩・バルサミコ酢 適量'],steps:['鮭を焼いてほぐす','パスタを茹でて冷やす','具材と調味料を和える']},
{name:'ブロッコリーと卵のサラダ',cat:'野菜',time:'10分',image:'https://images.unsplash.com/photo-1547496502-affa22d38842?auto=format&fit=crop&w=800&q=80',tags:['野菜','卵','作り置き','簡単'],ingredients:['ブロッコリー 1/2株','卵 2個','塩・こしょう 適量'],steps:['ブロッコリーを茹でる','卵を茹でて切る','塩こしょうで和える']},
{name:'さつまいもプロテインビスコッティ',cat:'お菓子・デザート',time:'35分',image:'https://images.unsplash.com/photo-1519864600265-abb23847ef2c?auto=format&fit=crop&w=800&q=80',tags:['高タンパク','おやつ','保存'],ingredients:['さつまいも味プロテイン','薄力粉','卵','水 適量'],steps:['材料を混ぜて成形する','一度焼いて切り分ける','低温で二度焼きして乾燥させる']}
];
function render(){const q=document.getElementById('search').value.trim().toLowerCase();document.getElementById('categories').innerHTML=categories.map(c=>'<button class="category '+(c===selected?'active':'')+'" data-cat="'+c+'">'+c+'</button>').join('');document.querySelectorAll('.category').forEach(b=>b.onclick=()=>{selected=b.dataset.cat;render()});const list=recipes.filter(r=>(selected==='すべて'||r.cat===selected)&&JSON.stringify(r).toLowerCase().includes(q));document.getElementById('recipes').innerHTML=list.length?list.map((r,i)=>'<article class="recipe" data-index="'+recipes.indexOf(r)+'"><div class="recipe-content"><div class="type">'+r.cat+'</div><h2>'+r.name+'</h2><div class="time">⏱ '+r.time+'</div><div class="tags">'+r.tags.map(t=>'<span class="tag">'+t+'</span>').join('')+'</div></div></article>').join(''):'<div class="empty">該当するレシピがありません。</div>';document.querySelectorAll('.recipe').forEach(card=>card.onclick=()=>showRecipe(Number(card.dataset.index)))}
function showRecipe(i){const r=recipes[i];document.getElementById('box').innerHTML='<button class="close" id="close">×</button>'+(r.image?'<img class="detail-image" src="'+r.image+'" alt="'+r.name+'">':'')+'<div class="type">'+r.cat+'</div><h2>'+r.name+'</h2><div class="time">⏱ '+r.time+'</div><h3>材料</h3><ul>'+r.ingredients.map(x=>'<li>'+x+'</li>').join('')+'</ul><h3>作り方</h3><ol>'+r.steps.map(x=>'<li>'+x+'</li>').join('')+'</ol>';openPanel()}
function openAdd(){document.getElementById('box').innerHTML='<button class="close" id="close">×</button><h2>レシピを追加</h2><div class="field"><label>料理名</label><input id="name"></div><div class="field"><label>区分</label><select id="cat">'+categories.slice(1).map(c=>'<option>'+c+'</option>').join('')+'</select></div><div class="field"><label>所要時間</label><input id="time" placeholder="20分"></div><div class="field"><label>料理写真（iPhoneの写真から選択）</label><input id="imageFile" type="file" accept="image/*"><img id="photoPreview" class="detail-image" style="display:none" alt="選択した料理写真"><input id="image" type="hidden"></div><div class="field"><label>画像URL（任意）</label><input id="imageUrl" placeholder="https://..."></div><div class="field"><label>タグ</label><input id="tags" placeholder="肉,和食,簡単,作り置き"></div><div class="field"><label>材料（1行1項目）</label><textarea id="ingredients"></textarea></div><div class="field"><label>作り方（1行1工程）</label><textarea id="steps"></textarea></div><button class="save" id="save">保存する</button>';openPanel();document.getElementById('imageFile').onchange=handlePhoto;document.getElementById('save').onclick=saveRecipe}
function handlePhoto(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{document.getElementById('image').value=reader.result;const preview=document.getElementById('photoPreview');preview.src=reader.result;preview.style.display='block'};reader.readAsDataURL(file)}
function saveRecipe(){const name=document.getElementById('name').value.trim()||'無題のレシピ';recipes.unshift({name,cat:document.getElementById('cat').value,time:document.getElementById('time').value||'—',image:document.getElementById('image').value||document.getElementById('imageUrl').value.trim(),tags:document.getElementById('tags').value.split(',').map(x=>x.trim()).filter(Boolean),ingredients:document.getElementById('ingredients').value.split('\n').filter(Boolean),steps:document.getElementById('steps').value.split('\n').filter(Boolean)});localStorage.setItem('myRecipeBook',JSON.stringify(recipes));closePanel();render()}
function openPanel(){document.getElementById('panel').classList.add('open');document.getElementById('close').onclick=closePanel}function closePanel(){document.getElementById('panel').classList.remove('open')}
document.getElementById('search').addEventListener('input',render);document.getElementById('addButton').onclick=openAdd;document.getElementById('panel').onclick=e=>{if(e.target.id==='panel')closePanel()};render();
</script>
</body>
</html>
