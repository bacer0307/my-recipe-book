<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8f4ed">
<title>わたしのレシピ帳</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#302b27;--sub:#776f67;--accent:#976744;--line:#e5dcd0;--bg:#f8f4ed;--white:#fffefa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #b78e6d;outline-offset:2px}.shell{max-width:1120px;margin:auto;padding:0 20px}.top{background:#fffaf4;border-bottom:1px solid var(--line)}.topline{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0}.brand{font-size:21px;font-weight:800;letter-spacing:.04em}.brand small{display:block;color:var(--accent);font-size:10px;letter-spacing:.2em;margin-bottom:3px}.top-actions{display:flex;gap:10px;align-items:center}.ghost,.primary,.outline{border-radius:12px;padding:10px 15px;border:1px solid var(--line);background:white;color:var(--ink)}.primary{background:var(--accent);color:white;border-color:var(--accent)}.outline{border-color:var(--accent);color:var(--accent)}.ghost:hover,.outline:hover{background:#f2e9df}.primary:hover{background:#815537}.muted{color:var(--sub)}main{padding-top:34px!important;padding-bottom:90px!important}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.18em;color:var(--accent)}h1{font-size:clamp(26px,4vw,39px);margin:8px 0 10px}h2{margin:0;font-size:22px}.intro{margin:0 0 30px;color:var(--sub);line-height:1.8}.category-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.category-tile{min-height:165px;border:1px solid var(--line);border-radius:20px;background:var(--white);text-align:left;padding:24px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s,box-shadow .15s}.category-tile:hover,.recipe-card:hover{transform:translateY(-2px);box-shadow:0 12px 26px #40302014}.category-tile .emoji{font-size:34px}.category-tile strong{font-size:22px}.category-tile .arrow{float:right;color:var(--accent)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.crumb{border:0;background:transparent;color:var(--accent);padding:8px 0;font-weight:700}.search{padding:12px 15px;border:1px solid var(--line);border-radius:12px;background:white;width:min(340px,100%)}.recipe-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.recipe-card{border:1px solid var(--line);border-radius:18px;background:var(--white);overflow:hidden;text-align:left;padding:0;transition:transform .15s,box-shadow .15s}.thumb{width:100%;height:205px;object-fit:cover;display:block;background:#eae0d3}.no-photo{display:grid;place-items:center;color:#b49d88;font-size:45px}.recipe-body{padding:17px}.recipe-body h3{font-size:19px;margin:0 0 12px}.meta{font-size:13px;color:var(--sub);margin:6px 0}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{font-size:12px;padding:5px 9px;border-radius:100px;background:#f2e8dd;color:#835938}.empty{padding:60px 20px;text-align:center;color:var(--sub);border:1px dashed #d6c8b9;border-radius:18px}.detail{max-width:850px;margin:0 auto}.detail-photo{width:100%;max-height:530px;object-fit:contain;background:#eee7de;border-radius:18px;display:block}.detail-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin:22px 0}.detail-heading h1{margin:0 0 10px}.section{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:23px;margin-top:18px}.section h2{font-size:20px;margin-bottom:15px}.lines{white-space:pre-wrap;line-height:2;overflow-wrap:anywhere}.steps{padding-left:25px;line-height:1.9}.steps li{padding-left:5px;margin-bottom:9px}.form{max-width:760px;margin:auto}.field{margin-bottom:18px}.field>label{display:block;font-weight:700;margin-bottom:8px}.field input[type=text],.field input[type=email],.field input[type=password],.field input[type=number],.field textarea{width:100%;padding:13px;border:1px solid #d9cdbf;border-radius:12px;background:white}.field textarea{min-height:130px;resize:vertical}.checks{display:flex;flex-wrap:wrap;gap:9px}.check{display:flex;align-items:center;gap:6px;border:1px solid var(--line);padding:10px 12px;border-radius:10px;background:white}.check input{accent-color:var(--accent)}.form-actions{display:flex;gap:10px;flex-wrap:wrap}.form-actions button{min-width:130px}.preview{max-width:100%;max-height:300px;object-fit:contain;border-radius:12px;margin-top:12px}.auth-card{max-width:460px;margin:30px auto;background:var(--white);padding:30px;border:1px solid var(--line);border-radius:20px}.auth-card h2{margin-bottom:8px}.auth-card .primary{width:100%}.notice{color:#a04235;font-size:14px;line-height:1.6}.loading{text-align:center;padding:50px}.hidden{display:none!important}@media(max-width:760px){.category-grid,.recipe-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.category-tile{min-height:145px;padding:18px}.category-tile strong{font-size:19px}.thumb{height:170px}.detail-heading{flex-direction:column}}@media(max-width:460px){.shell{padding-left:14px;padding-right:14px}.topline{padding:15px 0}.brand{font-size:18px}.category-grid,.recipe-grid{gap:10px}.category-tile{min-height:132px;padding:15px}.category-tile .emoji{font-size:27px}.category-tile strong{font-size:17px}.thumb{height:140px}.recipe-body{padding:12px}.recipe-body h3{font-size:16px}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}.section{padding:17px}.auth-card{padding:22px}}
.category-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}.category-tile{min-height:0;aspect-ratio:1;border:0;border-radius:50%;background:transparent;padding:0;display:block;box-shadow:none}.category-tile:hover{box-shadow:none}.category-badge{display:block;width:100%;height:100%;object-fit:contain}.category-tile:focus-visible{outline:3px solid #976744;outline-offset:5px}@media(max-width:760px){.category-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}}@media(max-width:460px){.category-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
</style>
</head>
<body>
<header class="top"><div class="shell topline"><div class="brand"><small>MY RECIPE BOOK</small>わたしのレシピ帳</div><div class="top-actions"><span id="userLabel" class="muted" style="font-size:12px"></span><button id="logoutBtn" class="ghost hidden" type="button">ログアウト</button></div></div></header>
<main class="shell" id="app"><div class="loading">読み込み中…</div></main>
<script>
'use strict';
const SUPABASE_URL='https://bysswjjserhznmrbevph.supabase.co';
const SUPABASE_KEY='sb_publishable_hCS3EhGtIDKeBTYdcoYDzQ_mMZBFjJH';
const TABLE='recipes';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const CATS=[{name:'朝',image:'icon/asa.png'},{name:'昼',image:'icon/hiru.png'},{name:'晩',image:'icon/ban.png'},{name:'デザート',image:'icon/dessert.png'},{name:'お弁当',image:'icon/bento.png'},{name:'1品もの',image:'icon/side.png'},{name:'冷凍保存可能',image:'icon/frozen.png'},{name:'ドレッシング・タレ',image:'icon/dressing.png'}];
const NAMES=CATS.map(c=>c.name);
const PREFIX='分類:';
let user=null,recipes=[],page={kind:'home'},imageValue='',busy=false;
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const asArray=v=>Array.isArray(v)?v:typeof v==='string'&&v.trim()?[v]:[];
const catsOf=r=>{const tagged=asArray(r.tags).filter(t=>typeof t==='string'&&t.startsWith(PREFIX)).map(t=>t.slice(PREFIX.length)).filter(x=>NAMES.includes(x));if(NAMES.includes(r.category)&&!tagged.includes(r.category))tagged.unshift(r.category);return tagged.length?[...new Set(tagged)]:['1品もの']};
const otherTags=r=>asArray(r.tags).filter(t=>typeof t==='string'&&!t.startsWith(PREFIX));
const normalize=r=>({...r,name:r.name||'無題のレシピ',time:r.time||'—',image:r.image||'',ingredients:asArray(r.ingredients),steps:asArray(r.steps),tags:asArray(r.tags)});
function show(p){page=p;render();window.scrollTo(0,0)}
function render(){document.getElementById('logoutBtn').classList.toggle('hidden',!user);document.getElementById('userLabel').textContent=user?.email||'';if(!user){renderHome();return}if(page.kind==='list')renderList();else if(page.kind==='detail')renderDetail();else if(page.kind==='edit')renderForm();else renderHome()}
function renderHome(){app.innerHTML=`<div class="eyebrow">MY KITCHEN</div><h1>今日は、なにを作る？</h1><p class="intro">カテゴリを選んで、お気に入りのレシピを探しましょう。</p>${!user?`<section class="auth-card"><h2>ログイン</h2><p class="muted">登録済みのメールアドレスとパスワードを入力してください。</p><form id="loginForm"><div class="field"><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">ログイン Pass</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary" type="submit">ログイン</button><p id="loginError" class="notice" role="alert"></p></form></section>`:''}${user?`<section style="margin-bottom:30px"><label for="homeSearch" style="display:block;font-weight:700;margin-bottom:10px">すべてのレシピから検索</label><input id="homeSearch" class="search" style="width:100%;max-width:650px" type="search" placeholder="料理名・材料・タグ・カテゴリで検索" aria-label="全レシピを検索"><div id="homeResults" style="margin-top:18px" aria-live="polite"></div></section>`:``}<div class="category-grid">${CATS.map(c=>`<button class="category-tile" type="button" data-cat="${esc(c.name)}"><img class="category-badge" src="${c.image}" alt="${esc(c.name)}" loading="lazy"></button>`).join('')}</div>${user?'<p style="margin-top:24px"><button class="primary" id="newRecipe">＋ 新しいレシピを登録</button></p>':''}`;document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{if(!user){document.getElementById('email')?.focus();return}show({kind:'list',cat:b.dataset.cat})});if(!user)document.getElementById('loginForm').onsubmit=login;else {document.getElementById('newRecipe').onclick=()=>show({kind:'edit',id:null,from:'home'});document.getElementById('homeSearch').oninput=drawHomeResults}}
function drawHomeResults(){const q=document.getElementById('homeSearch').value.trim().toLowerCase();const area=document.getElementById('homeResults');if(!q){area.innerHTML='';return}const found=recipes.filter(r=>[r.name,...r.ingredients,...otherTags(r),...catsOf(r)].join(' ').toLowerCase().includes(q));area.innerHTML=`<p class="muted">検索結果：${found.length} 件</p><div class="recipe-grid">${found.length?found.map(r=>`<button class="recipe-card" type="button" data-home-id="${esc(r.id)}">${r.image?`<img class="thumb" src="${esc(r.image)}" alt="${esc(r.name)}" loading="lazy">`:'<div class="thumb no-photo">🍳</div>'}<div class="recipe-body"><h3>${esc(r.name)}</h3><div class="meta">⏱ ${esc(r.time)}</div><div class="chips">${catsOf(r).map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div></div></button>`).join(''):'<div class="empty" style="grid-column:1/-1">一致するレシピがありません。</div>'}</div>`;area.querySelectorAll('[data-home-id]').forEach(b=>b.onclick=()=>show({kind:'detail',id:b.dataset.homeId,from:'home'}))}
function renderList(){const cat=page.cat;app.innerHTML=`<div class="toolbar"><button class="crumb" id="back">← カテゴリ一覧に戻る</button><input id="search" class="search" type="search" placeholder="料理名・材料・タグで検索" aria-label="レシピを検索"></div><div class="eyebrow">CATEGORY</div><h1>${esc(cat)}</h1><p class="intro" id="count"></p><div id="cards" class="recipe-grid"></div><p style="margin-top:24px"><button id="newRecipe" class="primary">＋ レシピを追加</button></p>`;document.getElementById('back').onclick=()=>show({kind:'home'});document.getElementById('newRecipe').onclick=()=>show({kind:'edit',id:null,from:cat});document.getElementById('search').oninput=drawCards;drawCards()}
function drawCards(){const q=document.getElementById('search').value.trim().toLowerCase();const found=recipes.filter(r=>catsOf(r).includes(page.cat)&&[r.name,...r.ingredients,...otherTags(r)].join(' ').toLowerCase().includes(q));document.getElementById('count').textContent=`${found.length} 件のレシピ`;document.getElementById('cards').innerHTML=found.length?found.map(r=>`<button class="recipe-card" type="button" data-id="${esc(r.id)}">${r.image?`<img class="thumb" src="${esc(r.image)}" alt="${esc(r.name)}" loading="lazy">`:'<div class="thumb no-photo">🍳</div>'}<div class="recipe-body"><h3>${esc(r.name)}</h3><div class="meta">⏱ ${esc(r.time)}</div><div class="chips">${catsOf(r).map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div></div></button>`).join(''):'<div class="empty" style="grid-column:1/-1">該当するレシピがありません。<br>「レシピを追加」から登録できます。</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>show({kind:'detail',id:b.dataset.id,from:page.cat}))}
function renderDetail(){const r=recipes.find(x=>String(x.id)===String(page.id));if(!r){show({kind:'home'});return}const from=page.from||catsOf(r)[0];app.innerHTML=`<div class="detail"><div class="toolbar"><button class="crumb" id="back">← ${from==='home'?'検索・カテゴリ一覧':esc(from)} に戻る</button></div>${r.image?`<img class="detail-photo" src="${esc(r.image)}" alt="${esc(r.name)}">`:'<div class="detail-photo no-photo" style="height:260px">🍳</div>'}<div class="detail-heading"><div><div class="eyebrow">RECIPE</div><h1>${esc(r.name)}</h1><div class="meta">⏱ 調理時間：${esc(r.time)}</div><div class="chips">${catsOf(r).map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div></div><div class="form-actions"><button id="edit" class="primary">✎ このレシピを編集</button><button id="delete" class="ghost">削除</button></div><section class="section"><h2>材料</h2><div class="lines">${r.ingredients.length?r.ingredients.map(esc).join('\n'):'材料が登録されていません。'}</div></section><section class="section"><h2>作り方</h2>${r.steps.length?`<ol class="steps">${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:'<p class="muted">作り方が登録されていません。</p>'}${otherTags(r).length?`<div class="chips">${otherTags(r).map(t=>`<span class="chip"># ${esc(t)}</span>`).join('')}</div>`:''}</section></div>`;document.getElementById('back').onclick=()=>from==='home'?show({kind:'home'}):show({kind:'list',cat:from});document.getElementById('edit').onclick=()=>show({kind:'edit',id:r.id,from});document.getElementById('delete').onclick=()=>removeRecipe(r,from)}
function renderForm(){const r=page.id!=null?recipes.find(x=>String(x.id)===String(page.id)):null;const active=r?catsOf(r):(NAMES.includes(page.from)?[page.from]:[]);imageValue=r?.image||'';app.innerHTML=`<div class="form"><button class="crumb" id="back">← 戻る</button><div class="eyebrow">RECIPE EDITOR</div><h1>${r?'レシピを編集':'新しいレシピを登録'}</h1><form id="recipeForm"><div class="field"><label for="name">料理名</label><input id="name" type="text" required value="${esc(r?.name||'')}"></div><div class="field"><label for="time">調理時間</label><input id="time" type="text" placeholder="例：20分" value="${esc(r?.time==='—'?'':r?.time||'')}"></div><div class="field"><label>カテゴリ（複数選択できます）</label><div class="checks">${CATS.map(c=>`<label class="check"><input type="checkbox" name="cat" value="${esc(c.name)}" ${active.includes(c.name)?'checked':''}>${c.icon} ${esc(c.name)}</label>`).join('')}</div></div><div class="field"><label for="photo">料理画像を選択</label><input id="photo" type="file" accept="image/*"><p class="muted" style="font-size:12px">写真を選ぶと自動的に縮小して保存します。画像を変更しない場合はそのままで大丈夫です。</p><img id="preview" class="preview ${imageValue?'':'hidden'}" ${imageValue?`src="${esc(imageValue)}"`:''} alt="料理写真のプレビュー"></div><div class="field"><label for="imageUrl">画像URL（任意）</label><input id="imageUrl" type="text" placeholder="https://...（URLを使う場合のみ）"></div><div class="field"><label for="ingredients">材料（1行に1項目）</label><textarea id="ingredients" placeholder="鶏肉 200g&#10;塩 少々">${esc(r?.ingredients.join('\n')||'')}</textarea></div><div class="field"><label for="steps">作り方（1行に1工程）</label><textarea id="steps" placeholder="材料を切る&#10;フライパンで炒める">${esc(r?.steps.join('\n')||'')}</textarea></div><div class="field"><label for="tags">タグ（カンマ区切り・任意）</label><input id="tags" type="text" value="${esc(r?otherTags(r).join(', '):'')}" placeholder="時短, 作り置き"></div><p id="formError" class="notice" role="alert"></p><div class="form-actions"><button class="primary" id="save" type="submit">${r?'変更を保存':'レシピを保存'}</button><button class="ghost" id="cancel" type="button">キャンセル</button></div></form></div>`;const back=()=>r?show({kind:'detail',id:r.id,from:page.from}):NAMES.includes(page.from)?show({kind:'list',cat:page.from}):show({kind:'home'});document.getElementById('back').onclick=back;document.getElementById('cancel').onclick=back;document.getElementById('photo').onchange=readPhoto;document.getElementById('recipeForm').onsubmit=e=>saveRecipe(e,r)}
async function readPhoto(e){const file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){alert('画像ファイルを選択してください。');return}try{const img=await createImageBitmap(file);const scale=Math.min(1,1400/img.width,1400/img.height);const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);imageValue=canvas.toDataURL('image/jpeg',.78);img.close?.();const preview=document.getElementById('preview');preview.src=imageValue;preview.classList.remove('hidden')}catch(err){console.error(err);alert('写真を読み込めませんでした。別の画像を試してください。')}}
async function saveRecipe(e,r){e.preventDefault();if(busy)return;const selected=[...document.querySelectorAll('input[name=cat]:checked')].map(x=>x.value);const msg=document.getElementById('formError');if(!selected.length){msg.textContent='カテゴリを1つ以上選択してください。';return}const name=document.getElementById('name').value.trim();if(!name){msg.textContent='料理名を入力してください。';return}const url=document.getElementById('imageUrl').value.trim();if(url&&!/^https?:\/\//i.test(url)){msg.textContent='画像URLは https:// または http:// から入力してください。';return}const payload={name,category:selected[0],time:document.getElementById('time').value.trim()||'—',image:url||imageValue,tags:[...selected.map(c=>PREFIX+c),...document.getElementById('tags').value.split(',').map(x=>x.trim()).filter(Boolean)],ingredients:document.getElementById('ingredients').value.split('\n').map(x=>x.trim()).filter(Boolean),steps:document.getElementById('steps').value.split('\n').map(x=>x.trim()).filter(Boolean)};busy=true;document.getElementById('save').disabled=true;msg.textContent='保存しています…';try{const query=r?sb.from(TABLE).update(payload).eq('id',r.id).eq('user_id',user.id):sb.from(TABLE).insert({...payload,user_id:user.id});const {data,error}=await query.select().single();if(error)throw error;const result=normalize(data);if(r)recipes=recipes.map(x=>String(x.id)===String(r.id)?result:x);else recipes.unshift(result);show({kind:'detail',id:result.id,from:NAMES.includes(page.from)?page.from:selected[0]})}catch(err){console.error(err);msg.textContent='保存できませんでした。通信状態やSupabaseの設定をご確認ください。';document.getElementById('save').disabled=false}finally{busy=false}}
async function removeRecipe(r,from){if(!confirm(`「${r.name}」を削除しますか？\nこの操作は元に戻せません。`))return;try{const {error}=await sb.from(TABLE).delete().eq('id',r.id).eq('user_id',user.id);if(error)throw error;recipes=recipes.filter(x=>String(x.id)!==String(r.id));show(from==='home'?{kind:'home'}:{kind:'list',cat:from})}catch(err){console.error(err);alert('削除できませんでした。')}}
async function login(e){e.preventDefault();const msg=document.getElementById('loginError');msg.textContent='ログインしています…';const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){msg.textContent='ログインできませんでした。メールアドレスとパスワードをご確認ください。';return}user=data.user;await loadRecipes();render()}
async function loadRecipes(){try{const {data,error}=await sb.from(TABLE).select('*').eq('user_id',user.id);if(error)throw error;recipes=(data||[]).map(normalize);render()}catch(err){console.error(err);recipes=[];app.innerHTML='<div class="empty">レシピを読み込めませんでした。通信状態とSupabaseの設定をご確認のうえ、再読み込みしてください。</div>'}}
document.getElementById('logoutBtn').onclick=async()=>{await sb.auth.signOut();user=null;recipes=[];show({kind:'home'})};
(async()=>{try{const {data,error}=await sb.auth.getSession();if(error)throw error;user=data.session?.user||null;if(user)await loadRecipes();else render()}catch(err){console.error(err);app.innerHTML='<div class="empty">接続できませんでした。ページを再読み込みしてください。</div>'}})();
</script>
</body>
</html>
