<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<title>わたしのレシピ帳</title>
<style>
/* 表示する端末に合わせて画像サイズを調整 */
@media (min-width:601px) {
  .recipe-image {
    height: 190px;
  }

  .detail-view {
    position: relative;
    width: min(90vw, 1200px);
    height: 90vh;
    max-height: 90vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .detail-view .close {
    position: absolute;
    top: 8px;
    right: 14px;
    z-index: 1;
  }

  .detail-only {
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: calc(90vh - 48px);
    object-fit: contain;
    margin: auto;
  }
}

@media (max-width:600px) {
  .recipe-image {
    height: 140px;
  }

  .detail-view {
    width: min(342px, 100%);
    height: auto;
    max-height: 90vh;
    display: block;
    padding: 18px;
  }

  .detail-only {
    width: min(306px, 100%);
    height: min(70vh, 540px);
  }
}
</style>
<style>
/* 表示する端末に合わせて画像サイズを調整 */
@media (min-width:601px){.recipe-image{height:190px}.detail-only{width:306px;height:540px}}
@media (max-width:600px){.recipe-image{height:140px}.detail-only{width:min(306px,100%);height:min(70vh,540px)}}
</style>
</head>
<body>
<div class="app">
<header class="hero"><div class="hero-inner"><div class="small">MY RECIPE BOOK</div><h1>今日、なに作る？</h1><p>自分だけの料理を、食材やカテゴリからすぐ探せるレシピ帳。</p><div id="authArea" style="margin-top:16px"></div></div></header>
<main class="main"><input class="search" id="search" placeholder="料理名・食材・タグで検索"><div class="categories" id="categories"></div><div class="grid" id="recipes"></div></main>
<button class="add" id="addButton">＋ レシピ追加</button>
</div>
<div class="panel" id="panel"><div class="box" id="box"></div></div>
<script>
const categories=['すべて','肉','魚介','野菜','卵','汁物','豆・大豆製品','ご飯・穀物','麺','パン・粉もの','ドレッシング','おつまみ','お菓子・デザート','その他'];
const SUPABASE_URL='https://bysswjjserhznmrbevph.supabase.co';
const SUPABASE_KEY='sb_publishable_hCS3EhGtIDKeBTYdcoYDzQ_mMZBFjJH';
const SUPABASE_TABLE='recipes';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null;
let selected='すべて';
let recipes=JSON.parse(localStorage.getItem('myRecipeBook')||'null')||[];
function render(){const q=document.getElementById('search').value.trim().toLowerCase();document.getElementById('categories').innerHTML=categories.map(c=>'<button class="category '+(c===selected?'active':'')+'" data-cat="'+c+'">'+c+'</button>').join('');document.querySelectorAll('.category').forEach(b=>b.onclick=()=>{selected=b.dataset.cat;render()});const list=currentUser?recipes.filter(r=>(selected==='すべて'||r.cat===selected)&&JSON.stringify(r).toLowerCase().includes(q)):[];document.getElementById('recipes').innerHTML=list.length?list.map(r=>'<article class="recipe" data-index="'+recipes.indexOf(r)+'">'+(r.image?'<img class="recipe-image" src="'+r.image+'" alt="'+r.name+'">':'<div class="recipe-image"></div>')+'<div class="recipe-content"><h2>'+r.name+'</h2><div class="time">⏱ '+r.time+'</div><div class="type" style="margin-top:8px">'+r.cat+'</div></div></article>').join(''):'<div class="empty">'+(currentUser?'該当するレシピがありません。':'ログインすると、あなたのレシピが表示されます。')+'</div>';document.querySelectorAll('.recipe').forEach(card=>card.onclick=()=>showRecipe(Number(card.dataset.index)))}
function renderAuth(){const a=document.getElementById('authArea');if(currentUser){a.innerHTML='<div style="font-size:13px;color:#766e65">ログイン中：'+currentUser.email+' <button id="logout" style="margin-left:8px;border:1px solid #ddd3c6;border-radius:8px;background:white;padding:6px 10px;cursor:pointer">ログアウト</button></div>';document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};return}a.innerHTML='<div style="display:flex;gap:8px;max-width:520px"><input id="loginEmail" type="email" placeholder="メールアドレス" style="flex:1;padding:10px;border:1px solid #ddd3c6;border-radius:9px;background:white"><input id="loginPassword" type="password" placeholder="パスワード" style="flex:1;padding:10px;border:1px solid #ddd3c6;border-radius:9px;background:white"><button id="login" style="border:0;border-radius:9px;background:#9a633e;color:white;padding:10px 14px;cursor:pointer;white-space:nowrap">ログイン</button></div><div id="loginMessage" style="font-size:12px;color:#9a633e;margin-top:7px"></div>';document.getElementById('login').onclick=login}
async function login(){const email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value;const m=document.getElementById('loginMessage');if(!email||!password){m.textContent='メールアドレスとパスワードを入力してください。';return}m.textContent='ログインしています…';const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){m.textContent='ログインできませんでした。メールアドレスまたはパスワードを確認してください。';return}currentUser=data.user;renderAuth();await loadRecipes()}
async function initAuth(){const {data}=await sb.auth.getSession();currentUser=data.session?.user||null;renderAuth();if(currentUser)await loadRecipes()}
function showRecipe(i){const r=recipes[i];document.getElementById('box').className='detail-view';document.getElementById('box').innerHTML='<button class="close" id="close" aria-label="閉じる">×</button>'+(r.image?'<img class="detail-only" src="'+r.image+'" alt="'+r.name+'">':'<div class="detail-only" style="display:grid;place-items:center;color:#766e65">画像がありません</div>');openPanel()}
function openAdd(){document.getElementById('box').className='box';document.getElementById('box').innerHTML='<button class="close" id="close">×</button><h2>レシピを追加</h2><div class="field"><label>料理名</label><input id="name"></div><div class="field"><label>区分</label><select id="cat">'+categories.slice(1).map(c=>'<option>'+c+'</option>').join('')+'</select></div><div class="field"><label>所要時間</label><input id="time" placeholder="20分"></div><div class="field"><label>料理写真（iPhoneの写真から選択）</label><input id="imageFile" type="file" accept="image/*"><img id="photoPreview" class="detail-image" style="display:none" alt="選択した料理写真"><input id="image" type="hidden"></div><div class="field"><label>画像URL（任意）</label><input id="imageUrl" placeholder="https://..."></div><div class="field"><label>タグ</label><input id="tags" placeholder="肉,和食,簡単,作り置き"></div><div class="field"><label>材料（1行1項目）</label><textarea id="ingredients"></textarea></div><div class="field"><label>作り方（1行1工程）</label><textarea id="steps"></textarea></div><button class="save" id="save">保存する</button>';openPanel();document.getElementById('imageFile').onchange=handlePhoto;document.getElementById('save').onclick=saveRecipe}
function handlePhoto(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{document.getElementById('image').value=reader.result;const preview=document.getElementById('photoPreview');preview.src=reader.result;preview.style.display='block'};reader.readAsDataURL(file)}
async function loadRecipes(){if(!currentUser)return;try{const {data,error}=await sb.from(SUPABASE_TABLE).select('*').eq('user_id',currentUser.id);if(error)throw error;if(Array.isArray(data)){recipes=data.map(r=>({id:r.id,name:r.name,cat:r.category,time:r.time||'—',image:r.image||'',tags:Array.isArray(r.tags)?r.tags:[],ingredients:Array.isArray(r.ingredients)?r.ingredients:[],steps:Array.isArray(r.steps)?r.steps:[]}));localStorage.setItem('myRecipeBook',JSON.stringify(recipes));render()}}catch(e){console.warn('Supabaseから読み込めませんでした。ローカルデータを使用します。',e)}}
async function saveRecipe(){if(!currentUser){alert('先にログインしてください。');return}const recipe={name:document.getElement
